<main class="page">
  <h1>Upcoming buses</h1>
  @if (combinedDepartures().length) {
    <ul class="departures">
      @for (departure of combinedDepartures(); track departure.time.getTime()) {
        <li class="departure">
          <div class="departure__line">{{ departure.lineLabel }}</div>
          <div class="departure__delta">{{ formatDelta(departure.minutesAway) }}</div>
          <div class="departure__time">{{ formatTime(departure.time) }}</div>
        </li>
      }
    </ul>
  } @else {
    <div class="status loading">Loading departures…</div>
  }
</main>
